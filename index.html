<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정원사의 널서리 통합관리</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4BF6B">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<!-- 🔴 첫 화면은 홈이다 (2026-09-17 우람님).
     깃허브 Pages 는 주소 끝이 `/` 면 index.html 을 준다 — 그 자리를 홈으로 보내는 팻말만 둔다.
     상품 화면은 상품.html 로 나갔다. 여기에 화면을 두면 주소로 들어온 사람은 늘 상품을 먼저 본다.
     meta refresh 와 replace 를 같이 쓴다 — 스크립트가 막힌 환경에서도 넘어가고,
     replace 라 「뒤로」가 이 팻말로 되돌아오지 않는다. -->
<meta http-equiv="refresh" content="0; url=홈.html">
<script>location.replace('홈.html');</script>
</head>
<body></body>
</html>
